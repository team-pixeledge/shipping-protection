# $coverTags comes from the validation's "vars" metafield ({"coverTags": [...]},
# written by app/lib/setup.server.ts); the default covers older installs.
query CartValidationsGenerateRunInput($coverTags: [String!] = []) {
  buyerJourney {
    step
  }
  presentmentCurrencyRate
  localization {
    language {
      isoCode
    }
    country {
      isoCode
    }
  }
  cart {
    lines {
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          requiresShipping
          product {
            id
            isGiftCard
            productType
            vendor
            hasAnyTag(tags: $coverTags)
          }
        }
      }
    }
  }
  validation {
    metafield(namespace: "$app:shipping-protection", key: "config") {
      jsonValue
    }
  }
}
